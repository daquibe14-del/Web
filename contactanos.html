        <title>Pepsi</title> 
    </head>

    <body>

        <header class="row">
            
            <a id="logo" href="index.html">
            <img src="img/logo.svg" alt="Logo">
            </a>

        </header>

        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                         <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="productos.html">Productos</a>
                         <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="contactanos.html">Contáctanos</a>
                    </ul>
                </div>
            </div>

        <div id="bannerinicio">

        </div>
        <div>
            <div class="row" id="contactform">

                <form mx-auto>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">NOMBRE</label>
                        <input type="text" class="form-control" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">CORREO</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">MENSAJE</label>
                        <textarea name="mensaje" class="form-control" id=""></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">ENVIAR MENSAJE</button>

                </form>

            </div>
        </div>

        <footer>

                <img src="img/logo-footer.svg" alt="logo-footer" mx-auto style="max-width: 200px;">

            <div id="linksfooter">
